apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
  namespace: praxis
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: praxis}
  template:
    metadata:
      labels: {app: praxis}
    spec:
      serviceAccountName: praxis-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: praxis-web:kubernetes
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          envFrom:
            - secretRef: {name: praxis-auth}
            - secretRef: {name: praxis-github, optional: true}
          env:
            - {name: PRAXIS_ENVIRONMENTS_REPOSITORY, value: siggikrol/praxis-environments}
            - {name: PRAXIS_CLOUD_EXECUTION_ENABLED, value: '0'}
            - {name: ENABLED_MODULES, value: "terraform_module_builder,terraform_stacks"}
            - {name: PRAXIS_TEST_BACKEND, value: kubernetes}
            - {name: PRAXIS_TOFU_NAMESPACE, value: praxis-runs}
            - {name: PRAXIS_TOFU_IMAGE, value: 'praxis-tofu-runner:kubernetes'}
            - {name: PRAXIS_TOFU_IMAGE_PULL_POLICY, value: Never}
            - {name: SESSION_FILE_DIR, value: /tmp/praxis-cache/flask_sessions}
            - {name: PS_ACTIVE_SESSIONS_REGISTRY, value: /tmp/praxis-cache/active_sessions.registry.json}
            - {name: PRAXIS_TERRAFORM_MODULE_BUILDER_DB, value: /tmp/praxis-cache/module-builder.sqlite3}
            - {name: FLASK_SECURE_COOKIES, value: '0'}
            - {name: PS_RUNTIME_ENV, value: dev}
          ports:
            - {containerPort: 5000, name: http}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '2', memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /tmp/praxis-cache}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: praxis-data}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
