services:
  cache-init:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    user: "0:0"
    entrypoint: ["sh", "-lc"]
    command:
      - "mkdir -p /tmp/praxis-cache/flask_sessions && chown -R 65532:65532 /tmp/praxis-cache && chmod -R ug+rwX /tmp/praxis-cache"
    volumes:
      - praxis_cache:/tmp/praxis-cache

  web:
    depends_on:
      cache-init:
        condition: service_completed_successfully
      tofu-runner:
        condition: service_healthy
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      FLASK_SECRET: ${FLASK_SECRET:?set a strong secret}
      FLASK_SECURE_COOKIES: ${FLASK_SECURE_COOKIES:-0}
      PS_RUNTIME_ENV: ${PS_RUNTIME_ENV:-dev}
      BASIC_USER: ${BASIC_USER:-admin}
      BASIC_PASSWORD: ${BASIC_PASSWORD:-change-me}
      # Only authoring is enabled by default. Explicitly empty disables all modules.
      ENABLED_MODULES: ${ENABLED_MODULES-terraform_module_builder,terraform_stacks}
      PRAXIS_TOFU_RUNNER_URL: http://tofu-runner:8080
      SESSION_FILE_DIR: /tmp/praxis-cache/flask_sessions
      PS_ACTIVE_SESSIONS_REGISTRY: /tmp/praxis-cache/active_sessions.registry.json
      # Optional infrastructure integrations stay inactive.
      PS_VALIDATE_CACHES_ON_STARTUP: "0"
      PS_AWS_CATALOG_REFRESHER_ENABLED: "0"
      PS_PC_SOURCE_REFRESHER_ENABLED: "0"
      PS_RELEASES_PROVIDER: disabled
      AWS_EC2_METADATA_DISABLED: "true"
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=2).read()"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - praxis_cache:/tmp/praxis-cache

  tofu-runner:
    build:
      context: .
      dockerfile: services/tofu_runner/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=2g,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port, credentials, app data, or Docker socket.

  nginx:
    image: nginx:stable-alpine
    depends_on:
      web:
        condition: service_healthy
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  praxis_cache:
