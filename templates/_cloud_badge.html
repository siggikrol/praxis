{% macro cloud_badge(provider) -%}
<span class="tf-cloud-badge tf-cloud-badge--{{ provider }}">{% if provider == 'aws' %}<i class="fa-brands fa-aws" aria-hidden="true"></i> AWS{% elif provider == 'google' %}<i class="fa-brands fa-google" aria-hidden="true"></i> Google Cloud{% else %}<i class="fa-solid fa-cloud" aria-hidden="true"></i> Cloud unspecified{% endif %}</span>
{%- endmacro %}
