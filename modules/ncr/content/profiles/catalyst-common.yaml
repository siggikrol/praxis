egress: {}
services:
  registries:
    source: ALL VPC
    destination: '{{ defaults.registry_destinations | join(''\n'') }}'
    protocol: NEEDS_CONFIRMATION
    purpose: Registries
    attribution: Catalyst Application Deployment and Integration Guide with Praxis, Network request, PDF 2026-09-14
      pages 20–23, ALL VPC / Registries
  paysafe:
    source: ILP
    destination: '*.paysafe.com'
    protocol: NEEDS_CONFIRMATION
    purpose: ILP egress
    attribution: Catalyst Application Deployment and Integration Guide with Praxis, Network request, PDF 2026-09-14
      pages 20–23, ILP VPC
  directory:
    source: ILP
    destination: '{{ defaults.directory_destinations | join('', '') }}'
    protocol: NEEDS_CONFIRMATION
    purpose: Active directory service (Keycloak/IDP)
    attribution: Catalyst Application Deployment and Integration Guide with Praxis, Network request, PDF 2026-09-14
      pages 20–23, Active directory service
  harbor:
    source: ALL VPC
    destination: '{{ defaults.harbor_host }}'
    protocol: NEEDS_CONFIRMATION
    purpose: Harbor registry
    attribution: Deployment-specific registry; replace the example host before use.
requires_confirmation:
- Endpoint and egress ports/protocols are not specified in the PDF tables; confirm them without borrowing ports
  from Cross VPC access.
- Confirm permitted source CIDRs and exact source/destination mappings.
- The guide prints icsis.int.<subdomain>.int.<root-domain>; this spelling is preserved pending confirmation.
- 'PDF 2026-09-14 page 22: BDE ingress Rancher host has a dot after <env>; egress does not. Confirm the actual BDE
  Rancher FQDN and its <env> mapping before configuring the Rancher rules.'
routing: {}
conditional: {}
builder:
  partner_choices:
  - - paysafe
    - Paysafe
  - - exponea
    - Exponea
  - - giact
    - Giact
  - - hashicorp
    - HashiCorp
  - - idology
    - IDology
  - - maxmind
    - MaxMind
  - - mkodo
    - Mkodo
  east_west_choices:
  - - ilp-cgs-postgres
    - 'ILP → CGS: Postgres (5432)'
  - - ilp-cgs-redis
    - 'ILP → CGS: Redis (6379)'
  - - ilp-cgs-rabbit
    - 'ILP → CGS: RabbitMQ (5671/5552)'
  - - ilp-cgs-https
    - 'ILP → CGS: HTTPS'
  - - ilp-fian-postgres
    - 'ILP → FIAN: Postgres (5432)'
  - - ilp-fian-https
    - 'ILP → FIAN: HTTPS'
  - - cgs-ilp-redis
    - 'CGS → ILP: Redis (6379)'
  - - cgs-ilp-rabbit
    - 'CGS → ILP: RabbitMQ (5671/5552)'
  - - cgs-ilp-postgres
    - 'CGS → ILP: Postgres (5432)'
  egress_rules:
    eks_to_aws:
      field: eks_to_aws
      kind: flag
      target: EKS → AWS public services
      negate_rfc1918: true
      markdown_label: EKS → AWS public services
    eks_to_registries:
      field: eks_to_registries
      kind: flag
      target: EKS → container registries (Harbor/GHCR/ECR)
      negate_rfc1918: true
      markdown_label: EKS → container registries (Harbor/GHCR/ECR)
    eks_to_cicd:
      field: eks_to_cicd
      kind: flag
      target: EKS → CI/CD (Catalyst)
      negate_rfc1918: true
      markdown_label: EKS → CI/CD (Catalyst)
    sumologic:
      field: sumologic
      kind: flag
      target: 'Observability: Sumo Logic (HTTPS)'
      negate_rfc1918: true
      markdown_label: Observability – Sumo Logic
    grafana:
      field: grafana
      kind: flag
      target: 'Observability: Grafana (HTTPS)'
      negate_rfc1918: true
      markdown_label: Observability – Grafana
    partners:
      field: partners
      kind: list
    flows:
      field: east_west
      kind: list
    win_to_ad:
      field: win_to_ad
      kind: flag
      target: Windows → AD/DCs
      negate_rfc1918: false
      markdown_label: Windows → AD/DCs
    win_to_sccm:
      field: win_to_sccm
      kind: flag
      target: Windows → SCCM/Update
      negate_rfc1918: false
      markdown_label: Windows → SCCM/Update
    kcm_ldaps_ad:
      field: kcm_ldaps_ad
      kind: flag
      target: KCM/Windows → AD LDAPS (636)
      negate_rfc1918: false
      markdown_label: KCM/Windows → AD LDAPS (636)
    win_to_duo:
      field: win_to_duo
      kind: flag
      target: Windows → Duo Security (HTTPS)
      negate_rfc1918: true
      markdown_label: Windows → Duo Security
    vpn_to_jumphosts:
      field: vpn_to_jumphosts
      kind: flag
      target: VPN → JumpHosts
      negate_rfc1918: false
      markdown_label: VPN → JumpHosts
    nessus_scans:
      field: nessus_scans
      kind: flag
      target: Nessus scanning
      negate_rfc1918: false
      markdown_label: Nessus scanning
    jmeter_access:
      field: jmeter_access
      kind: flag
      target: JMeter access
      negate_rfc1918: false
      markdown_label: JMeter access
    adfs_to_apps:
      field: adfs_to_apps
      kind: flag
      target: ADFS → apps (HTTPS)
      negate_rfc1918: false
      markdown_label: ADFS → apps (HTTPS)
    notes:
      field: notes
      kind: notes
  labels:
    eks_to_aws: EKS → AWS public services
    eks_to_registries: EKS → registries
    eks_to_cicd: EKS → CI/CD
    sumologic: 'Observability: Sumo Logic'
    grafana: 'Observability: Grafana'
    partners: 3rd-party partners
    east_west: Inter-VPC flows
    win_to_ad: Windows → AD/DCs
    win_to_sccm: Windows → SCCM
    kcm_ldaps_ad: KCM/Windows → AD LDAPS
    win_to_duo: Windows → Duo Security
    vpn_to_jumphosts: VPN → JumpHosts
    nessus_scans: Nessus scanning
    jmeter_access: JMeter testing
    adfs_to_apps: ADFS → apps
    notes: Egress notes
  ingress_defaults:
    outgoing_paysafe_allowed: unknown
    port_8080_cross_vpc: 'true'
    eu_ngl_dev_ad_access: 'true'
  ingress_labels:
    outgoing_paysafe_allowed: Outgoing Paysafe Allowed?
    port_8080_cross_vpc: Port 8080 cross-VPC?
    eu_ngl_dev_ad_access: EU NGL-Dev AD access?
  ingress_targets:
    paysafe_txt: Outgoing traffic to Paysafe
    port8080_txt: Port 8080 cross-VPC
    adacc_txt: EU NGL-Dev Active Directory access
