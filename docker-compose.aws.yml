# Opt-in integration settings: docker compose -f docker-compose.yml -f docker-compose.aws.yml up --build
services:
  web:
    environment:
      PS_RELEASES_PROVIDER: s3
      PS_RELEASES_S3_BUCKET: ${PS_RELEASES_S3_BUCKET:?set your release bucket}
      AWS_ACCESS_KEY_ID: ${PS_RELEASES_S3_ACCESS_KEY_ID:?set your AWS access key}
      AWS_SECRET_ACCESS_KEY: ${PS_RELEASES_S3_SECRET_ACCESS_KEY:?set your AWS secret key}
      AWS_SESSION_TOKEN: ${PS_RELEASES_S3_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-central-1}
      PS_AWS_CATALOG_REFRESHER_ENABLED: "1"
      PS_VALIDATE_CACHES_ON_STARTUP: "1"
      PS_VALIDATE_PC_SOURCE_CACHE_ON_STARTUP: "0"
      PS_VALIDATE_SPACELIFT_CACHE_ON_STARTUP: "0"
